name: Daily Alliance Leaderboard

on:
  # Triggered every hour at XX:01 UTC by an external scheduler (cron-job.org) through the GitHub API,
  # Retries the 01:01 UTC daily slot until fresh Mightpulse data is available; summarizes Monday 00:01.
  workflow_dispatch:
    inputs:
      correct:
        description: "Replace today's posted sample and send a correction to the normal channel"
        type: boolean
        default: false
      correction_date:
        description: "UTC date to correct (YYYY-MM-DD); prevents a queued correction from targeting another day"
        type: string
        default: ""
      test_gift_codes:
        description: "Post a gift-code test to the test channel without changing saved state"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hourly-alliance-leaderboard
  cancel-in-progress: false

jobs:
  post:
    if: ${{ inputs.test_gift_codes != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGDOM: ${{ secrets.KINGDOM || '2426' }}
      STATE_BRANCH: leaderboard-state
      STATE_FILE: state/leaderboard.json
      SNAPSHOT_FILE: state/snapshot.ts
      GIFT_CODES_STATE_FILE: state/gift-codes.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load saved standings
        id: load
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_FILE")"
          status=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
            if git cat-file -e "origin/$STATE_BRANCH:leaderboard.json" 2> /dev/null; then
              git show "origin/$STATE_BRANCH:leaderboard.json" > "$STATE_FILE"
            fi
            if git cat-file -e "origin/$STATE_BRANCH:snapshot.ts" 2> /dev/null; then
              git show "origin/$STATE_BRANCH:snapshot.ts" > "$SNAPSHOT_FILE"
            fi
            if git cat-file -e "origin/$STATE_BRANCH:gift-codes.json" 2> /dev/null; then
              git show "origin/$STATE_BRANCH:gift-codes.json" > "$GIFT_CODES_STATE_FILE"
            fi
          elif [ "$status" -eq 2 ]; then
            echo "No saved standings yet; starting a new week."
          else
            exit "$status"
          fi

      - name: Post leaderboard
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CORRECT_DAILY: ${{ inputs.correct }}
          CORRECTION_DATE: ${{ inputs.correction_date }}
        run: |
          if [ "$CORRECT_DAILY" = "true" ]; then
            node src/run.ts --correct
          else
            node src/run.ts
          fi

      - name: Check active gift codes
        if: always() && steps.load.outcome == 'success'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CODES_CHANNEL_ID: ${{ vars.DISCORD_CODES_CHANNEL_ID || '1568946919567392908' }}
        run: node src/run-gift-codes.ts

      - name: Save standings, snapshot log and gift codes
        # Also runs after a partial failure so standings that were already posted are saved.
        if: always() && steps.load.outcome == 'success'
        run: |
          set -euo pipefail
          entries=()
          for file in "$STATE_FILE" "$SNAPSHOT_FILE" "$GIFT_CODES_STATE_FILE"; do
            if [ -f "$file" ]; then
              entries+=("$(printf '100644 blob %s\t%s' "$(git hash-object -w "$file")" "$(basename "$file")")")
            fi
          done
          [ "${#entries[@]}" -gt 0 ] || exit 0
          tree=$(printf '%s\n' "${entries[@]}" | git mktree)
          parent=()
          if git rev-parse -q --verify "refs/remotes/origin/$STATE_BRANCH" > /dev/null; then
            if [ "$(git rev-parse "origin/$STATE_BRANCH^{tree}")" = "$tree" ]; then
              echo "Saved bot state unchanged."
              exit 0
            fi
            parent=(-p "origin/$STATE_BRANCH")
          fi
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" "${parent[@]}" -m "Update standings")
          git push origin "$commit:refs/heads/$STATE_BRANCH"

  test-gift-codes:
    if: ${{ inputs.test_gift_codes == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Post test gift codes
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CODES_CHANNEL_ID: "1561449272690344068"
          GIFT_CODES_STATE_FILE: ${{ runner.temp }}/gift-codes-test.json
        run: node src/run-gift-codes.ts
