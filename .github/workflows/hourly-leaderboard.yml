name: Hourly Alliance Leaderboard

on:
  # Triggered every hour at XX:01 UTC by an external scheduler (cron-job.org) through the GitHub API,
  # because GitHub's own schedule was unreliable. Every run posts and counts, so do not add a schedule here too.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-alliance-leaderboard
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGDOM: ${{ secrets.KINGDOM || '2426' }}
      STATE_BRANCH: leaderboard-state
      STATE_FILE: state/leaderboard.json
      SNAPSHOT_FILE: state/snapshot.ts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load saved standings
        id: load
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_FILE")"
          status=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
            git show "origin/$STATE_BRANCH:leaderboard.json" > "$STATE_FILE"
            if git cat-file -e "origin/$STATE_BRANCH:snapshot.ts" 2> /dev/null; then
              git show "origin/$STATE_BRANCH:snapshot.ts" > "$SNAPSHOT_FILE"
            fi
          elif [ "$status" -eq 2 ]; then
            echo "No saved standings yet; starting a new week."
          else
            exit "$status"
          fi

      - name: Post leaderboard
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
        run: node src/run.ts

      - name: Save standings and snapshot log
        # Also runs after a partial failure so standings that were already posted are saved.
        if: always() && steps.load.outcome == 'success'
        run: |
          set -euo pipefail
          [ -f "$STATE_FILE" ] || exit 0
          entries=$(printf '100644 blob %s\tleaderboard.json\n' "$(git hash-object -w "$STATE_FILE")")
          if [ -f "$SNAPSHOT_FILE" ]; then
            entries+=$'\n'$(printf '100644 blob %s\tsnapshot.ts\n' "$(git hash-object -w "$SNAPSHOT_FILE")")
          fi
          tree=$(printf '%s\n' "$entries" | git mktree)
          parent=()
          if git rev-parse -q --verify "refs/remotes/origin/$STATE_BRANCH" > /dev/null; then
            if [ "$(git rev-parse "origin/$STATE_BRANCH^{tree}")" = "$tree" ]; then
              echo "Standings unchanged."
              exit 0
            fi
            parent=(-p "origin/$STATE_BRANCH")
          fi
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" "${parent[@]}" -m "Update standings")
          git push origin "$commit:refs/heads/$STATE_BRANCH"
