name: StratForge Leaderboard Broadcast

on:
  schedule:
    # GitHub Actions scheduled workflows cannot run more often than every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: stratforge-leaderboard-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Leaderboard Broadcast
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          KINGDOM: ${{ secrets.KINGDOM || '2426' }}
          STRATFORGE_SESSION_TOKEN: ${{ secrets.STRATFORGE_SESSION_TOKEN }}
          HEADLESS: "true"
        run: npm run broadcast
