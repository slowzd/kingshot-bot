name: Mightpulse Leaderboard Broadcast

on:
  schedule:
    # The second trigger is a fallback if GitHub delays or skips the first.
    - cron: '1 * * * *'
    - cron: '31 * * * *'
  workflow_dispatch:

concurrency:
  group: mightpulse-leaderboard-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    env:
      KINGDOM: ${{ secrets.KINGDOM || '2426' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore cumulative rankings
        uses: actions/cache@v4
        with:
          path: snapshots/cumulative-ranking-*.json
          key: mightpulse-cumulative-${{ env.KINGDOM }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mightpulse-cumulative-${{ env.KINGDOM }}-

      - name: Run Leaderboard Broadcast
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SCHEDULED" = "true" ]; then
            npm run broadcast -- --scheduled
          else
            npm run broadcast
          fi
