name: Daily StratForge Leaderboard Broadcast

on:
  schedule:
    # 23:20 dansk tid (CEST / UTC+2 = 21:20 UTC)
    - cron: '20 21 * * *'
    # 23:30 dansk tid (CEST / UTC+2 = 21:30 UTC)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Leaderboard Broadcast
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          KINGDOM: ${{ secrets.KINGDOM || '2426' }}
          STRATFORGE_SESSION_TOKEN: ${{ secrets.STRATFORGE_SESSION_TOKEN }}
          HEADLESS: "true"
        run: npm run broadcast
